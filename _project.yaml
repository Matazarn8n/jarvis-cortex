# R7 goal auditor: workspace-graph engine must answer on :5210 (systemd jarvis-cortex.service).
verify:
  - curl -sf --max-time 5 -o /dev/null http://127.0.0.1:5210/
workflows: []
docs:
  - README.md
  - NOTICE
# outputs = des CHEMINS (le validator fait Path(...).exists()). Le role de
# chaque fichier va en commentaire, pas dans la valeur.
#   server.js : moteur workspace-graph, http://127.0.0.1:5210 (systemd jarvis-cortex.service)
#   brain.js  : CLI recall/store
outputs:
  - server.js
  - brain.js
