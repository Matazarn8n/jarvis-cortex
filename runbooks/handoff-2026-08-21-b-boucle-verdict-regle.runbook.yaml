# Bloc B — la boucle « verdict de gate → règle de mémoire ».
#
# Aujourd'hui un gate Codex rend un verdict, un défaut est constaté, et la règle
# qui en découle est écrite À LA MAIN, plus tard, si quelqu'un y pense. B câble
# la réinjection : un verdict qui révèle un défaut écrit lui-même sa règle via
# `brain.js store --type feedback`, donc au régime procédural versionné posé en
# M-T1 (brain.js:197-206 — un `feedback` réécrit copie l'ancien en `<base>.vN.md`
# avant d'être remplacé ; rien n'est perdu).
#
# PRÉREQUIS : ce régime versionné vit dans le worktree du bloc M. Si `BRAIN_JS`
# résolvait vers un jarvis-cortex qui ne le porte pas encore, la sonde B-T3
# échouerait sur `.v1` absent — c'est le bon signal, pas un faux négatif.
#
# DETTES MOTEUR (une ligne chacune, hors périmètre des tickets ci-dessous) :
# dette: `--deny-write` ne borne pas les écritures d'un `check:` hors `repo:` — la sonde B-T3 écrit dans le `.cache/sandbox-memory` de jarvis-cortex, hors de ce dépôt.
# dette: un `check:` ne peut pas appeler un script livré par un ticket AVAL en épinglant son sha256 — le condensat n'existe pas quand le runbook s'écrit. Les checks restent donc inline ; la matrice de verdicts est sortie en livrable de B-T1, ce qui les ramène de 34 à ~16 lignes.
# dette: `allow_tools` accepte `Glob`/`Grep`, que le runner n'expose pas, et `Bash` reste cantonné au worktree ; aucune session de plan ne peut énumérer un répertoire hors dépôt.
# dette: `AskUserQuestion` échoue en session de plan (`readonly database`) — un ticket ne peut pas poser la question que la consigne lui impose de poser.

phase: "B"
project: b-boucle-verdict-regle-2026-08-21
repo: /home/nuveo/hermes-os-plan-b
description: >-
  Câbler la réinjection verdict → règle : un défaut relevé par un gate Codex
  écrit sa propre règle de mémoire, au régime procédural versionné de M-T1.

requires_access:
  - file: /home/nuveo/hermes-os-plan-b/.git
  - file: /home/nuveo/hermes-os-plan-b/ops/plan_runner.py

tickets:

  - id: B-T1
    kind: session
    title: Contrat d'injection — quel verdict écrit quelle règle, et laquelle jamais
    model: claude-opus-5
    effort: high
    codex_gate: true
    max_budget_usd: 3.00
    prompt_file: tickets/B-T1.md
    produces:
      - docs/plans/2026-08-21-b-contrat-injection.md
      - docs/plans/2026-08-21-b-contrat-injection.matrice.json
    # Le contrat rédigé fixe la doctrine ; la matrice JSON la rend exécutable et
    # devient le jeu d'épreuves de B-T2. Le check lit les deux livrables et ne
    # fait confiance à aucun marqueur imprimé par la session. Il refuse une
    # matrice dégénérée : couverture des six verdicts, au moins un cas productif,
    # et zéro règle sur une panne de reviewer.
    check: |
      "$HERMES_CHECK_PYTHON" - <<'PY'
      import json, os, pathlib, sys
      json.loads(os.environ["HERMES_TICKET_FACTS"])
      d = pathlib.Path("docs/plans/2026-08-21-b-contrat-injection.md").read_text(encoding="utf-8")
      mat = json.loads(pathlib.Path("docs/plans/2026-08-21-b-contrat-injection.matrice.json").read_text(encoding="utf-8"))
      cas = {c["verdict"]: c for c in mat["cas"]}
      manque = [a for a in ("plan_runner.py:7327", "GO_AVEC_RESERVES", "NO_VERDICT", "REVIEWER_DOWN", "brain.js", "sha256", "idempotence", "MEMORY.md") if a not in d]
      absents = [v for v in ("GO", "GO_AVEC_RESERVES", "NO_GO", "NO_VERDICT", "NO_REVIEWER", "REVIEWER_DOWN") if v not in cas]
      # littéraux scindés : le runbook ne doit pas porter lui-même la formule interdite.
      interdit = [p for p in ("aucun " + "CRITIQUE", "aucune " + "HAUTE", "ni " + "HAUTE") if p in d]
      if manque or absents or interdit:
          sys.exit(f"contrat: ancres absentes={manque} verdicts hors matrice={absents} critere inatteignable={interdit}")
      productifs = [c["verdict"] for c in mat["cas"] if c["regles"] > 0 and len(c.get("cles", [])) == c["regles"]]
      if not productifs or cas["REVIEWER_DOWN"]["regles"] or cas["NO_REVIEWER"]["regles"] or "sha256" not in mat.get("derivation_slug", ""):
          sys.exit(f"matrice degeneree: productifs_avec_cles={productifs} panne={cas['REVIEWER_DOWN']['regles']}/{cas['NO_REVIEWER']['regles']} derivation={mat.get('derivation_slug')!r}")
      print(f"B-T1: 6/6 verdicts couverts, cas productifs={productifs}, slug derive par {mat['derivation_slug']}")
      PY

  - id: B-T2
    kind: session
    title: La décision — `regles_depuis_verdict()`, pure et déterministe
    model: claude-sonnet-5
    effort: medium
    codex_gate: true
    max_budget_usd: 2.50
    prompt_file: tickets/B-T2.md
    produces:
      - ops/plan_runner.py
    # Sonde comportementale pilotée par la matrice de B-T1 : la fonction est
    # APPELÉE sur les SIX verdicts du domaine, pas seulement sur trois. Les cas
    # attendus à zéro (GO propre, NO_VERDICT, les deux pannes) sont le test de
    # mutation : un stub qui produit toujours échoue.
    # Le slug est recalculé ici par sha256 — une dérivation par `hash()`, non
    # reproductible d'un processus à l'autre, ne peut pas passer.
    check: |
      "$HERMES_CHECK_PYTHON" - <<'PY'
      import hashlib, importlib.util, json, os, pathlib, sys
      json.loads(os.environ["HERMES_TICKET_FACTS"])
      spec = importlib.util.spec_from_file_location("pr", pathlib.Path("ops/plan_runner.py").resolve())
      m = importlib.util.module_from_spec(spec); spec.loader.exec_module(m)
      mat = json.loads(pathlib.Path("docs/plans/2026-08-21-b-contrat-injection.matrice.json").read_text(encoding="utf-8"))
      ecarts = []
      for c in mat["cas"]:
          r = m.regles_depuis_verdict(c["verdict"], c["rapport"])
          if len(r) != c["regles"]:
              ecarts.append(f"{c['verdict']}->{len(r)} regle(s), attendu {c['regles']}")
          for regle, cle in zip(r, c.get("cles", [])):
              attendu = "feedback_" + hashlib.sha256(cle.encode("utf-8")).hexdigest()[:12]
              if regle["slug"] != attendu:
                  ecarts.append(f"{c['verdict']}: slug {regle['slug']!r} != sha256 attendu {attendu!r}")
      if ecarts:
          sys.exit("sonde matrice: " + " · ".join(ecarts))
      print(f"sonde: {len(mat['cas'])} verdicts exerces, {sum(c['regles'] for c in mat['cas'])} regle(s) produite(s), slugs = sha256 du contrat")
      PY

  - id: B-T3
    kind: session
    title: L'écriture — pont vers brain.js, versionnement, index, idempotence
    model: claude-opus-5
    effort: high
    codex_gate: true
    max_budget_usd: 2.00
    prompt_file: tickets/B-T3.md
    produces:
      - ops/brain_bridge.py
    # Trois exigences, une seule sonde, sur le pont réel en sandbox :
    #  1. réécriture avec un fait DIFFÉRENT -> `.v1` garde l'ancien (régime M-T1) ;
    #  2. écriture -> UNE ligne d'index (rubrique 4 du constat : 328 fichiers sur
    #     432 ne sont dans aucun index, B ne doit pas grossir ce tas) ;
    #  3. gate REJOUÉ à l'identique -> ni `.v2`, ni seconde ligne d'index.
    # Le slug porte le pid et l'horloge : deux exécutions concurrentes ne peuvent
    # pas effacer leurs preuves mutuelles. Le nettoyage retire les fichiers ET les
    # lignes d'index de CETTE exécution — la sonde ne laisse pas de pointeur mort.
    check: |
      "$HERMES_CHECK_PYTHON" - <<'PY'
      import importlib.util, json, os, pathlib, sys, time
      json.loads(os.environ["HERMES_TICKET_FACTS"])
      spec = importlib.util.spec_from_file_location("bb", pathlib.Path("ops/brain_bridge.py").resolve())
      bb = importlib.util.module_from_spec(spec); spec.loader.exec_module(bb)
      if not bb.BRAIN_JS.exists(): sys.exit(f"brain.js introuvable a l'emplacement resolu: {bb.BRAIN_JS}")
      slug = f"feedback_sonde_b_t3_{os.getpid()}_{time.time_ns()}"
      box = bb.BRAIN_JS.parent / ".cache" / "sandbox-memory"; idx = box / "MEMORY.md"
      lu = lambda nom: (box / nom).read_text(encoding="utf-8") if (box / nom).exists() else ""
      try:
          index = []
          for fait in ("PREMIER", "SECOND", "SECOND"):  # 3e appel = gate rejoue a l'identique
              bb.ecrire_regle({"slug": slug, "fait": fait, "why": "sonde B-T3"}, sandbox=True)
              index.append(lu("MEMORY.md").count(slug))
          etat = ("PREMIER" in lu(f"{slug}.v1.md"), "SECOND" in lu(f"{slug}.md"), (box / f"{slug}.v2.md").exists(), index)
          if etat != (True, True, False, [1, 1, 1]):
              sys.exit(f"sonde pont: v1_garde_PREMIER={etat[0]} courant_SECOND={etat[1]} v2_empilee={etat[2]} lignes_index={etat[3]} (attendu True/True/False/[1,1,1])")
          print(f"sonde pont: .v1 garde PREMIER · courant SECOND · rejeu inerte (pas de .v2) · index {index}")
      finally:
          for p in box.glob(f"{slug}*.md"): p.unlink()
          if idx.exists(): idx.write_text("".join(l for l in idx.read_text(encoding="utf-8").splitlines(True) if slug not in l), encoding="utf-8")
      PY

  - id: B-T4
    kind: session
    title: Le branchement — l'appel à 7327, et l'échec d'écriture qui se voit
    model: claude-sonnet-5
    effort: medium
    codex_gate: true
    max_budget_usd: 1.50
    prompt_file: tickets/B-T4.md
    produces:
      - ops/plan_runner.py
    # La sonde APPELLE `injecter_regles()` avec son propre écrivain injecté : elle
    # exerce le branchement lui-même, pas seulement les briques. Passe 3 avec un
    # écrivain qui lève : la boucle ne doit ni tomber (un gate ne casse pas parce
    # que la mémoire n'a pas pu s'écrire) ni avaler l'échec — il doit atterrir
    # dans le state du ticket, visible au rapport.
    # Le point d'accroche est vérifié par AST — un vrai nœud `Call`, pas une
    # sous-chaîne : un commentaire mentionnant `injecter_regles(` ne passe pas.
    check: |
      "$HERMES_CHECK_PYTHON" - <<'PY'
      import ast, importlib.util, json, pathlib, os, sys
      json.loads(os.environ["HERMES_TICKET_FACTS"])
      src = pathlib.Path("ops/plan_runner.py").resolve()
      spec = importlib.util.spec_from_file_location("pr", src)
      m = importlib.util.module_from_spec(spec); spec.loader.exec_module(m)
      rap = "VERDICT: NO_GO\nCRITIQUE | ops/x.py:12 | le verdict n'ecrit aucune regle | cabler l'appel"
      vus = []
      def ok(regle, **kw): vus.append(regle["slug"]); return {"etat": "ecrite", "fichier": regle["slug"] + ".md"}
      def casse(regle, **kw): raise RuntimeError("brain.js code 1: [brain] store refuse")
      res = []
      for verdict, rapport, ecrivain in (("NO_GO", rap, ok), ("GO", "VERDICT: GO\nRAS", ok), ("NO_GO", rap, casse)):
          ts = {}; m.injecter_regles(verdict, rapport, ts, ecrire=ecrivain)  # passe 3 : ne doit PAS lever
          res.append([e.get("etat", "") for e in ts.get("regles_memoire", [])])
      arbre = ast.parse(src.read_text(encoding="utf-8"))
      pose = [n.lineno for n in ast.walk(arbre) if isinstance(n, ast.Constant) and n.value == "verdict_motif"]
      appels = [n.lineno for n in ast.walk(arbre) if isinstance(n, ast.Call) and getattr(n.func, "id", "") == "injecter_regles"]
      if res[0] != ["ecrite"] or len(vus) != 1 or res[1] or not any(e.startswith("echec") for e in res[2]) or not any(0 <= a - p < 40 for p in pose for a in appels):
          sys.exit(f"branchement: NO_GO={res[0]} ecritures={len(vus)} GO={res[1]} echec={res[2]} accroche(verdict_motif={pose[:3]}, appels_AST={appels[:3]})")
      print(f"sonde branchement: NO_GO->1 ecriture journalisee · GO->0 · echec remonte {res[2]} · appel AST en {appels} apres verdict_motif {pose}")
      PY
