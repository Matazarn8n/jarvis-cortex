# Bloc B — la boucle « verdict de gate → règle de mémoire ».
#
# Aujourd'hui un gate Codex rend un verdict, un défaut est constaté, et la règle
# qui en découle est écrite À LA MAIN, plus tard, si quelqu'un y pense. B câble
# la réinjection : un verdict qui révèle un défaut écrit sa règle via
# `brain.js store --type feedback`, donc au régime procédural versionné posé en
# M-T1 (brain.js:197-206 — un `feedback` réécrit copie l'ancien en `<base>.vN.md`
# avant d'être remplacé ; rien n'est perdu).
#
# PÉRIMÈTRE — B ne touche AUCUN fichier de gouvernance du moteur. Les trois
# fichiers `ops/plan_runner.py`, `ops/plan_doctor.py` et `ops/plan_factory.py` ne
# sont jamais modifiés par ce bloc : B livre un vérificateur, trois modules neufs
# et un point d'entrée en ligne de commande. Le raccordement du moteur à ce point
# d'entrée est une dette, pas un ticket — c'est l'Owner qui le tranche.
#
# LES CONTRÔLES SONT UN LIVRABLE, PAS DU YAML. B-T0 écrit `ops/checks/sonde_b.py`
# et son sceau ; les quatre `check:` suivants sont un appel d'une ligne. C'est la
# règle des quinze lignes, tenue et non pas exemptée : aucun `check:` de ce
# runbook ne porte de programme.
#
# PRÉREQUIS : le régime versionné vit dans le worktree du bloc M. Si `BRAIN_JS`
# résolvait vers un jarvis-cortex qui ne le porte pas encore, la sonde B-T3
# échouerait sur `.v1` absent — c'est le bon signal, pas un faux négatif.
#
# DETTES MOTEUR (une ligne chacune, hors périmètre des tickets ci-dessous) :
# dette: le raccordement du moteur (un appel après `ts["verdict_motif"]`, vers 7327) reste à faire par le mainteneur du moteur — une session de plan ne touche pas aux fichiers de gouvernance, et B s'arrête donc au point d'entrée CLI livré par B-T4.
# dette: un runbook ne peut pas épingler le sha256 d'un script que l'un de ses propres tickets crée — le condensat n'existe pas à l'écriture ; le sceau `ops/checks/sonde_b.sha256`, écrit par B-T0 et relu par chaque sonde, est le plus proche substitut atteignable sans changement du moteur.
# dette: le runner ne borne pas les écritures d'un `check:` hors `repo:` — les sondes B-T3 et B-T4 écrivent dans un bac à sable propre à l'exécution, sous le `.cache/` de jarvis-cortex, hors de ce dépôt.
# dette: aucun `check:` ne peut lire la liste des fichiers du diff du ticket ; la non-régression de périmètre se borne donc au contenu des trois fichiers de gouvernance, pas à une whitelist du commit.
# dette: `allow_tools` accepte `Glob`/`Grep`, que le runner n'expose pas, et `Bash` reste cantonné au worktree ; aucune session de plan ne peut énumérer un répertoire hors dépôt.
# dette: `AskUserQuestion` échoue en session de plan (`readonly database`) — un ticket ne peut pas poser la question que la consigne lui impose de poser.

phase: "B"
project: b-boucle-verdict-regle-2026-08-21
repo: /home/nuveo/hermes-os-plan-b
description: >-
  Câbler la réinjection verdict → règle : un défaut relevé par un gate Codex
  écrit sa propre règle de mémoire, au régime procédural versionné de M-T1,
  dans des modules neufs — aucun fichier de gouvernance n'est touché.

requires_access:
  - file: /home/nuveo/hermes-os-plan-b/.git
  - file: /home/nuveo/hermes-os-plan-b/ops/plan_runner.py

tickets:

  - id: B-T0
    kind: session
    title: Le vérificateur — les quatre sondes de B, en un script, et son autotest
    why: >-
      Un contrôle empaqueté en one-liners YAML n'est ni relu, ni testé, ni
      corrigeable : c'est ce qui a fait passer, ailleurs, des sondes qui
      acceptaient une matrice malformée et des modules à moitié cassés. Le
      vérificateur devient donc un livrable relu par un gate, écrit AVANT les
      modules qu'il juge — il ne peut pas être taillé pour les faire passer.
    model: claude-opus-5
    effort: high
    codex_gate: true
    max_budget_usd: 3.00
    prompt_file: tickets/B-T0.md
    produces:
      - ops/checks/sonde_b.py
      - ops/checks/sonde_b.sha256
    # Le check de ce ticket est l'autotest du vérificateur lui-même : chaque
    # sonde est confrontée à un arbre valide ET à une série d'arbres cassés
    # plausibles, et doit accepter le premier et refuser chacun des seconds. Un
    # vérificateur permissif — celui qui aurait laissé passer les défauts de
    # l'audit — échoue ici, avant d'avoir servi. La sortie nomme les cas rejetés.
    check: '"$HERMES_CHECK_PYTHON" ops/checks/sonde_b.py autotest --facts "$HERMES_TICKET_FACTS"'

  - id: B-T1
    kind: session
    title: Contrat d'injection — quel verdict écrit quelle règle, et laquelle jamais
    why: >-
      Sans contrat écrit, chacun des trois tickets suivants réinvente le
      déclencheur et la dérivation du slug — et une boucle qui écrit vite avec
      trois conventions divergentes fabrique des doublons à la cadence des gates.
    model: claude-opus-5
    effort: high
    codex_gate: true
    max_budget_usd: 3.00
    prompt_file: tickets/B-T1.md
    produces:
      - docs/plans/2026-08-21-b-contrat-injection.md
      - docs/plans/2026-08-21-b-contrat-injection.matrice.json
    # Le contrat rédigé fixe la doctrine ; la matrice JSON la rend exécutable et
    # devient le jeu d'épreuves de B-T2. La sonde `contrat` refuse une matrice
    # dégénérée ET une matrice malformée : exactement les six verdicts du
    # domaine, uniques, aucun cas en trop, clés exactes sur chaque cas,
    # `cles`/`attendus` de longueur `regles` (donc vides sur un cas à zéro), au
    # moins un cas productif, zéro règle sur les deux pannes de reviewer. Les
    # comptes imprimés sont calculés, jamais littéraux.
    check: '"$HERMES_CHECK_PYTHON" ops/checks/sonde_b.py contrat --facts "$HERMES_TICKET_FACTS" --sceau ops/checks/sonde_b.sha256'

  - id: B-T2
    kind: session
    title: La décision — `regles_depuis_verdict()`, pure et déterministe
    why: >-
      Isoler la décision dans une fonction pure et sans effet de bord est la
      seule façon de l'exercer sur les six verdicts du domaine : les branches où
      la boucle ne doit RIEN écrire ne se testent pas autrement.
    model: claude-sonnet-5
    effort: medium
    codex_gate: true
    max_budget_usd: 2.50
    prompt_file: tickets/B-T2.md
    produces:
      - ops/verdict_regles.py
    # Module NEUF — aucun fichier de gouvernance n'est touché ici.
    # La sonde `decision` appelle la fonction sur les SIX verdicts et vérifie
    # chaque règle rendue en entier : clés exactes, `type` valant `feedback`,
    # `fait` et `why` non vides et portant le contenu que la matrice annonce en
    # `attendus`, slug égal au `sha256` de la clé. Une règle sans `fait` ni
    # `why` — qui passait le compte et cassait plus tard au pont — échoue ici.
    # Les cas attendus à zéro sont le test de mutation : un stub qui produit
    # toujours échoue.
    check: '"$HERMES_CHECK_PYTHON" ops/checks/sonde_b.py decision --facts "$HERMES_TICKET_FACTS" --sceau ops/checks/sonde_b.sha256'

  - id: B-T3
    kind: session
    title: L'écriture — pont vers brain.js, versionnement, index, idempotence
    why: >-
      C'est le seul ticket qui touche le disque, et une erreur s'y industrialise
      à la cadence des gates : sans idempotence portée ici, un gate rejoué empile
      une version et une ligne d'index par tentative.
    model: claude-opus-5
    effort: high
    codex_gate: true
    max_budget_usd: 2.50
    prompt_file: tickets/B-T3.md
    produces:
      - ops/brain_bridge.py
    # Module NEUF — aucun fichier de gouvernance n'est touché ici.
    # La sonde `pont` travaille dans un bac à sable PROPRE À L'EXÉCUTION
    # (`racine=`, dossier neuf portant pid et horloge) : aucun `MEMORY.md`
    # partagé, donc aucune course entre deux exécutions, et le nettoyage retire
    # le dossier entier — rien d'autre. Trois exigences, un seul passage :
    #  1. réécriture avec un fait DIFFÉRENT -> `.v1` garde l'ancien (régime M-T1) ;
    #  2. écriture -> UNE ligne d'index (rubrique 4 du constat : 328 fichiers sur
    #     434 ne sont dans aucun index, B ne doit pas grossir ce tas) ;
    #  3. gate REJOUÉ à l'identique -> ni `.v2`, ni seconde ligne d'index.
    check: '"$HERMES_CHECK_PYTHON" ops/checks/sonde_b.py pont --facts "$HERMES_TICKET_FACTS" --sceau ops/checks/sonde_b.sha256'

  - id: B-T4
    kind: session
    title: Le point d'entrée — `injecter_regles()`, sa CLI, et l'échec qui se voit
    why: >-
      Une session de plan ne touche pas aux fichiers de gouvernance : la boucle
      s'arrête donc à un point d'entrée autonome, appelable et observable, que le
      mainteneur du moteur raccorde ensuite — sans quoi B n'aurait aucun livrable
      exerçable de bout en bout.
    model: claude-sonnet-5
    effort: medium
    codex_gate: true
    max_budget_usd: 2.00
    prompt_file: tickets/B-T4.md
    produces:
      - ops/verdict_hook.py
    # Module NEUF, avec une CLI. La sonde `entree` exerce les DEUX chemins :
    #  · écrivain injecté — NO_GO -> 1 entrée `ecrite`, GO -> 0, écrivain qui
    #    lève -> aucune exception mais un `etat` commençant par `echec` ;
    #  · chemin PAR DÉFAUT (`ecrire=None`) contre un bac à sable propre à
    #    l'exécution : l'import paresseux du pont et la mutation réelle sont
    #    exercés, et la preuve est le FICHIER apparu sur le disque, pas l'état
    #    rendu ; puis le même chemin par défaut contre une racine impossible,
    #    qui doit rendre un `echec` observable sans lever.
    # Enfin la CLI en sous-processus, dont on lit la sortie réelle, et la
    # non-régression de périmètre sur les trois fichiers de gouvernance.
    check: '"$HERMES_CHECK_PYTHON" ops/checks/sonde_b.py entree --facts "$HERMES_TICKET_FACTS" --sceau ops/checks/sonde_b.sha256'
